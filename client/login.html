<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NicheGate — Sign In</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'14'%20fill%3D'%230a0f17'%2F%3E%3Ctext%20x%3D'32'%20y%3D'42'%20font-family%3D'Arial%2Csans-serif'%20font-size%3D'28'%20font-weight%3D'800'%20fill%3D'%232dd4bf'%20text-anchor%3D'middle'%3ENG%3C%2Ftext%3E%3C%2Fsvg%3E">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0f17;color:#e2e8f0;font-family:'Inter',system-ui,sans-serif}
.card{width:min(380px,90vw);background:#111827;border:1px solid #1e293b;border-radius:16px;padding:36px 34px;box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.mark{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#2dd4bf,#0a0f17);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;color:#0a0f17;font-family:'Space Grotesk'}
h1{font-family:'Space Grotesk';font-size:1.4rem;font-weight:700;margin:18px 0 4px;letter-spacing:.2px}
p{font-size:.82rem;color:#7c8aa0;line-height:1.5}
form{margin-top:22px;display:flex;flex-direction:column;gap:14px}
label{font-size:.7rem;letter-spacing:1.2px;text-transform:uppercase;color:#7c8aa0;font-weight:600}
input{background:#0d1420;border:1px solid #1e293b;color:#e2e8f0;border-radius:10px;padding:12px 14px;font-size:.9rem;outline:none}
input:focus{border-color:#2dd4bf;box-shadow:0 0 0 3px rgba(45,212,191,.15)}
button{margin-top:6px;background:#2dd4bf;color:#06231f;border:none;border-radius:10px;padding:13px;font-weight:800;font-size:.85rem;cursor:pointer;font-family:'Space Grotesk'}
button:hover{filter:brightness(1.1)}
.err{display:none;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5;border-radius:8px;padding:9px 12px;font-size:.78rem}
.err.show{display:block}
.hint{margin-top:18px;font-size:.68rem;color:#56708c;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="mark">NG</div>
  <h1>NicheGate Console</h1>
  <p>Sign in to manage the product factory.</p>
  <div class="err" id="err"></div>
  <form id="login-form">
    <div><label>Admin password</label><input type="password" id="pass" autocomplete="current-password" placeholder="••••••••" required></div>
    <button type="submit" id="btn">Sign In</button>
  </form>
  <div class="hint">Autonomous sweeps, generation &amp; publishing keep running server-side — login only guards this control surface.</div>
</div>
<script type="module" src="/js/login.js"></script>
</body>
</html>
