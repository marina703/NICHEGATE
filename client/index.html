<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NicheGate — Operations Console</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060a;--bg2:#070a11;--panel:#0a0e16;--panel2:#0e1420;
  --surface:#0c111b;--panel-hi:#111a28;
  --border:#161d2b;--border-soft:#121826;--border-hover:#26344b;--muted:#7b879c;
  --text:#e8eef8;--text2:#a8b5c8;--text3:#6b7789;
  --teal:#2dd4bf;--green:#10b981;--amber:#f59e0b;--red:#ef4444;--blue:#4f8ff7;--violet:#8b5cf6;
  --teal-glow:rgba(45,212,191,.35);--teal-dim:rgba(45,212,191,.12);
  --blue-dim:rgba(79,143,247,.14);--green-dim:rgba(16,185,129,.14);
  --amber-dim:rgba(245,158,11,.14);--red-dim:rgba(239,68,68,.14);--violet-dim:rgba(139,92,246,.14);
  --gradient-strong:linear-gradient(90deg,#2dd4bf,#4f8ff7 55%,#8b5cf6);
  --gradient-soft:linear-gradient(135deg,rgba(45,212,191,.16),rgba(139,92,246,.16));
  --radius:14px;--radius-sm:10px;--radius-xs:7px;
  --mono:'Space Grotesk','Consolas',monospace;--sans:'Inter',system-ui,sans-serif;
  --shadow:0 18px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;overflow:hidden;display:flex;-webkit-font-smoothing:antialiased}
h1,h2,h3,.kpi .num,.rail-link,.tag{font-family:var(--mono)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--muted)}
/* Layout */
#rail{width:66px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;backdrop-filter:blur(20px)}
.rail-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--blue));display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:800;color:#09090b;box-shadow:0 0 20px var(--teal-glow)}
.rail-link{width:48px;height:44px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;border-radius:var(--radius-sm);color:var(--muted);cursor:pointer;transition:all 0.2s}
.rail-link:hover{background:var(--surface);color:var(--text)}
.rail-link.active{background:var(--teal-dim);color:var(--teal);box-shadow:inset 0 0 0 1px rgba(45,212,191,0.2)}
.rail-div{width:30px;height:1px;background:var(--border);margin:4px}
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
#topbar{display:flex;align-items:center;gap:14px;padding:11px 20px;background:rgba(24,24,27,0.8);border-bottom:1px solid var(--border);flex-shrink:0;backdrop-filter:blur(12px)}
#topbar .crumb{color:#7c8aa0;font-size:0.8rem}
#topbar .sp{flex:1}
.auto-status{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:0.72rem;font-weight:700;cursor:pointer;background:#151d2c;border:1px solid var(--border);cursor:pointer}
.auto-status.live{color:var(--teal);border-color:rgba(45,212,191,.4)}
.auto-status .pl{width:8px;height:8px;border-radius:50%;background:#7c8aa0}
.auto-status.live .pl{background:var(--teal);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
#content{flex:1;overflow:auto;padding:20px 24px}
/* Common */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);transition:border-color 0.2s,box-shadow 0.2s}
.panel:hover{border-color:var(--border-hover)}
.panel-title{font-size:0.78rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#7c8aa0;padding:11px 15px;border-bottom:1px solid var(--border)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh h2{font-size:1.15rem;font-weight:700;letter-spacing:-.2px}
.sh .desc{font-size:0.78rem;color:#7c8aa0;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);border:none;background:var(--surface);color:var(--text);font-size:0.78rem;font-weight:600;cursor:pointer;border:1px solid var(--border);transition:all 0.15s;font-family:var(--sans)}
.btn:hover{filter:brightness(1.2);border-color:var(--border-hover);transform:translateY(-1px)}
.btn.primary{background:var(--teal);color:#09090b;box-shadow:0 0 20px var(--teal-glow);font-weight:700}
.btn.green{background:var(--green);color:#09090b;box-shadow:0 0 15px var(--green-dim);font-weight:700}
.btn.amber{background:var(--amber);color:#1a1202}
.btn.red{background:var(--red);color:#1a0607}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:8px 12px;font-family:var(--sans);font-size:0.85rem;outline:none;transition:border-color 0.15s}
input:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-dim)}
.search{display:flex;align-items:center;gap:8px;background:#0d1420;border:1px solid var(--border);border-radius:8px;padding:6px 10px}
.search input{border:none;background:transparent;flex:1}
/* KPI + funnel */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--gradient-strong);opacity:0.5}
.kpi .lb{font-size:0.66rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .num{font-size:1.8rem;font-weight:800;letter-spacing:-0.5px;font-family:var(--mono)}
.kpi .sb{font-size:0.72rem;color:#7c8aa0;margin-top:2px}
.kpi.tc .num{color:var(--teal)}.kpi.gn .num{color:var(--green)}.kpi.am .num{color:var(--amber)}.kpi.rd .num{color:var(--red)}.kpi.bl .num{color:var(--blue)}
.funnel{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 17px;overflow-x:auto}
.funnel .st{display:flex;flex-direction:column;align-items:center;min-width:80px;gap:4px;background:none;border:none;padding:4px;cursor:pointer;color:inherit;font-family:inherit}
.funnel .st:hover .ring{border-color:var(--teal);color:var(--teal)}
.funnel .st .ring{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--mono);font-size:0.95rem;border:2px solid var(--border);color:#7c8aa0;background:#0d1420;transition:all .15s}
.funnel .st.on .ring{border-color:var(--teal);color:var(--teal)}
.funnel .st .l{font-size:0.6rem;text-transform:uppercase;color:#7c8aa0;letter-spacing:.4px}
.funnel .ar{color:#2a3a4f;font-size:1rem}
/* tags + status */
.tpill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:0.66rem;font-weight:700;background:#151d2c;color:#7c8aa0;border:1px solid var(--border)}
.tpill::before{content:'';width:7px;height:7px;border-radius:50%;background:inherit;margin-right:4px}
.st-draft{background:var(--blue);box-shadow:0 0 10px var(--blue-dim)}.st-pending-review{background:var(--amber);box-shadow:0 0 10px var(--amber-dim)}.st-approved{background:var(--teal);box-shadow:0 0 10px var(--teal-dim)}.st-listed{background:var(--green);box-shadow:0 0 10px var(--green-dim)}.st-published{background:var(--green);box-shadow:0 0 10px var(--green-dim)}.st-rejected{background:var(--red);box-shadow:0 0 10px var(--red-dim)}.st-archived{background:#64748b}.st-researching{background:#64748b}.st-generating{background:#4b8bd4}
/* catalog */
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all 0.25s cubic-bezier(0.4,0,0.2,1)}
.card:hover{transform:translateY(-4px);border-color:var(--teal);box-shadow:0 8px 30px rgba(0,0,0,0.3),0 0 20px var(--teal-dim)}
.card .thumb{aspect-ratio:4/5;background:#0d1420;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.card .thumb .ph{font-size:2.4rem}
.card .ck{position:absolute;top:8px;left:8px;width:20px;height:20px;border-radius:6px;border:2px solid #2a3a4f;background:transparent}
.card.sel .ck{background:var(--teal);border-color:var(--teal)}
.card.sel{outline:1px solid var(--teal)}
.card .bd{padding:9px 12px}
.card .nm{font-size:0.76rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .mt{font-size:0.66rem;color:#7c8aa0;margin-top:2px}
.card .pr{font-size:0.85rem;font-weight:700;color:var(--teal);font-family:var(--mono)}
/* review */
.rows{display:flex;flex-direction:column;gap:10px}
.rrow{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:11px 15px}
.rrow .rt{width:58px;height:72px;object-fit:cover;border-radius:8px;background:#0d1420}
.rrow .nm{font-weight:700;font-size:0.84rem}
.rrow .mt{color:#7c8aa0;font-size:0.73rem;margin-top:3px}
.rrow .tags,.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rrow .acts{display:flex;gap:6px;flex-wrap:wrap}
.concept{margin-top:6px;font-size:0.72rem;color:#9fb3c8;background:rgba(45,212,191,.06);border-left:2px solid var(--teal);padding:4px 8px;border-radius:0 6px 6px 0;line-height:1.4}
.concept .ci{color:var(--teal);margin-right:4px}
/* log */
.logs{display:flex;flex-direction:column;gap:6px;max-height:380px;overflow:auto}
.logrow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;background:#0d1420;font-size:0.74rem}
.logrow .t{color:#7c8aa0;width:56px;font-family:var(--mono)}
.logrow .act{font-weight:700;color:var(--teal);min-width:96px}
.logrow .tx{flex:1;color:#e2e8f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logrow.warning .tx{color:var(--amber)}.logrow.error .tx{color:var(--red)}.logrow.success .tx{color:var(--green)}
/* trends */
.trend{display:flex;align-items:center;gap:12px;padding:11px 15px;background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:10px}
.trend .nm{font-weight:700}.trend .mt{color:#7c8aa0;font-size:0.73rem}
.grade{min-width:64px;padding:3px 10px;border-radius:999px;font-size:0.7rem;font-weight:800;border:1px solid var(--border)}
.grade.ACTIVATE{color:var(--green);border-color:rgba(16,185,129,.4)}
.grade.WATCH{color:var(--amber);border-color:rgba(245,158,11,.4)}
.grade.SKIP{color:var(--red);border-color:rgba(239,68,68,.4)}
/* marketplace connections */
.conn{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:#151d2c;margin-bottom:10px}
.conn .dv{width:10px;height:10px;border-radius:50%}
.conn.ok .dv{background:var(--green)}.conn.bad .dv{background:var(--red)}
.conn .cx{flex:1;font-size:0.82rem;font-weight:600}
/* modals */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.modal.open{display:flex}
.edwin{background:var(--bg);border:1px solid var(--border);border-radius:14px;width:min(1260px,94vw);height:92vh;display:flex;flex-direction:column;overflow:hidden}
.edbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border)}
.edbar .title{flex:1;font-weight:700;font-size:0.85rem}
.edbar input[type=color]{width:34px;height:30px;border:none;background:none;cursor:pointer}
.edbody{flex:1;overflow:auto;background:#fff}
.edbody .pv{min-height:100%}
.pwin{background:var(--bg);border:1px solid var(--border);border-radius:14px;width:min(1160px,92vw);height:90vh;display:flex;flex-direction:column}
.pbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border)}
.pframe{flex:1;border:none;background:#fff}
/* toast */
#toasts{position:fixed;bottom:20px;right:20px;z-index:400;display:flex;flex-direction:column;gap:10px;max-width:400px}
.toast{background:rgba(24,24,27,0.95);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:0 14px 40px rgba(0,0,0,0.5);padding:12px 16px;border-left:3px solid var(--blue);backdrop-filter:blur(20px)}
.toast.info{border-left-color:var(--blue)}.toast.success{border-left-color:var(--green)}.toast.warning{border-left-color:var(--amber)}.toast.error{border-left-color:var(--red)}
.toast .tt{font-size:0.8rem;font-weight:700}.toast .tm{font-size:0.73rem;color:#7c8aa0;line-height:1.35}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}

/* ── DESIGN DNA BADGES ── */
.dna-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:0.58rem;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;line-height:1.4}
.dna-badge.editorial{background:rgba(196,149,106,0.15);color:#c4956a;border:1px solid rgba(196,149,106,0.2)}
.dna-badge.brutalist{background:rgba(255,51,51,0.12);color:#ff5555;border:1px solid rgba(255,51,51,0.2)}
.dna-badge.organic{background:rgba(124,182,157,0.15);color:#7cb69d;border:1px solid rgba(124,182,157,0.2)}
.dna-badge.technical{background:rgba(0,163,224,0.12);color:#00a3e0;border:1px solid rgba(0,163,224,0.2)}
.dna-badge.luxe{background:rgba(212,175,55,0.12);color:#d4af37;border:1px solid rgba(212,175,55,0.2)}
.dna-badge.playful{background:rgba(255,107,107,0.12);color:#ff6b6b;border:1px solid rgba(255,107,107,0.2)}
.dna-badge.minimal{background:rgba(100,100,100,0.1);color:#999;border:1px solid rgba(100,100,100,0.2)}
.dna-badge.heritage{background:rgba(139,69,19,0.12);color:#a0724a;border:1px solid rgba(139,69,19,0.2)}
.dna-niche{font-size:0.55rem;color:#7c8aa0;margin-top:2px}
.dna-strip{height:3px;border-radius:0 0 12px 12px;margin-top:-1px}
.dna-strip.editorial{background:linear-gradient(90deg,#c4956a,#1a1a1a)}
.dna-strip.brutalist{background:linear-gradient(90deg,#ff3333,#0a0a0a)}
.dna-strip.organic{background:linear-gradient(90deg,#7cb69d,#f0c987)}
.dna-strip.technical{background:linear-gradient(90deg,#00a3e0,#ff6b35)}
.dna-strip.luxe{background:linear-gradient(90deg,#d4af37,#b8956a)}
.dna-strip.playful{background:linear-gradient(90deg,#ff6b6b,#ffd93d)}
.dna-strip.minimal{background:linear-gradient(90deg,#999,#0066ff)}
.dna-strip.heritage{background:linear-gradient(90deg,#8b4513,#c8956a)}


@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 5px var(--teal-glow)}50%{box-shadow:0 0 20px var(--teal-glow)}}
.animate-in{animation:fadeIn 0.3s ease-out}

/* ============ DARK COMMAND CENTER POLISH ============ */
body{background:
  radial-gradient(1100px 620px at 8% -12%,rgba(45,212,191,.10),transparent 62%),
  radial-gradient(900px 560px at 102% 4%,rgba(139,92,246,.10),transparent 60%),
  radial-gradient(760px 520px at 50% 118%,rgba(79,143,247,.07),transparent 60%),
  var(--bg);color:var(--text)}
#main{background:linear-gradient(180deg,rgba(255,255,255,.012),transparent 320px)}
#content{background-image:linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.016) 1px,transparent 1px);background-size:52px 52px;background-position:-1px -1px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1b2434;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#2c3b53;background-clip:padding-box}
#rail{width:74px;background:linear-gradient(180deg,#080c14,#05080e);border-right:1px solid var(--border);box-shadow:1px 0 30px rgba(0,0,0,.6)}
.rail-mark{width:40px;height:40px;border-radius:12px;background:var(--gradient-strong);color:#03060b;box-shadow:0 0 26px var(--teal-glow),inset 0 1px 0 rgba(255,255,255,.35);letter-spacing:-.5px}
.rail-link{width:52px;height:46px;border-radius:12px;color:var(--text3);border:1px solid transparent}
.rail-link:hover{background:rgba(255,255,255,.045);color:var(--text);border-color:var(--border)}
.rail-link.active{background:linear-gradient(135deg,rgba(45,212,191,.18),rgba(139,92,246,.14));color:#fff;border-color:rgba(45,212,191,.32);box-shadow:0 0 22px rgba(45,212,191,.18),inset 0 0 0 1px rgba(255,255,255,.05)}
.rail-txt{font-family:var(--mono);font-size:.6rem;font-weight:700;letter-spacing:.6px}
.rail-div{width:34px;background:linear-gradient(90deg,transparent,var(--border),transparent);height:1px}
#topbar{background:rgba(6,9,15,.72);border-bottom:1px solid var(--border);box-shadow:0 10px 34px rgba(0,0,0,.45)}
#topbar .crumb{font-family:var(--mono);font-weight:600;letter-spacing:1.6px;text-transform:uppercase;font-size:.68rem;color:var(--text2)}
.auto-status{background:rgba(10,15,24,.9);border-color:var(--border);color:var(--text2);letter-spacing:.4px}
.auto-status.live{color:var(--teal);border-color:rgba(45,212,191,.45);box-shadow:0 0 18px rgba(45,212,191,.14)}
.panel{background:linear-gradient(180deg,var(--panel-hi),var(--panel) 46%);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 12px 34px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.035)}
.panel:hover{border-color:var(--border-hover);box-shadow:0 16px 44px rgba(0,0,0,.5),0 0 0 1px rgba(45,212,191,.07),inset 0 1px 0 rgba(255,255,255,.05)}
.panel-title{font-family:var(--mono);color:var(--text2);border-bottom:1px solid var(--border-soft);background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);letter-spacing:1.6px}
.sh h2{font-family:var(--mono);font-size:1.22rem;font-weight:700;letter-spacing:-.3px;background:linear-gradient(90deg,#fff,#b9c6d9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sh .desc{color:var(--text3)}
.btn{background:linear-gradient(180deg,#131b29,#0d1420);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);box-shadow:0 2px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.045)}
.btn:hover{border-color:var(--border-hover);transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07)}
.btn.ghost{background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--text2)}
.btn.ghost:hover{color:var(--text);background:rgba(255,255,255,.07)}
.btn.primary{background:linear-gradient(135deg,#2dd4bf,#1fa8a0);color:#03110f;box-shadow:0 0 26px rgba(45,212,191,.34),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.green{background:linear-gradient(135deg,#10b981,#0d9668);color:#02120c;box-shadow:0 0 22px rgba(16,185,129,.3),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.amber{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1a1202}
.btn.red{background:linear-gradient(135deg,#ef4444,#c62828);color:#1a0607}
input,select,textarea{background:#080d15;border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm)}
input::placeholder,textarea::placeholder{color:var(--text3)}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-dim);background:#0a1018}
select option{background:#0a0e16;color:var(--text)}
.search{background:#070b12;border:1px solid var(--border);border-radius:var(--radius-sm)}
.kpi{background:linear-gradient(180deg,var(--panel-hi),var(--panel) 55%);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 12px 30px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.04)}
.kpi::before{height:2px;background:var(--gradient-strong);opacity:.85}
.kpi:hover{border-color:var(--border-hover);box-shadow:0 16px 40px rgba(0,0,0,.55),0 0 26px rgba(45,212,191,.09)}
.kpi .lb{color:var(--text3);font-family:var(--mono);letter-spacing:1.4px}
.kpi .num{text-shadow:0 0 26px rgba(255,255,255,.12)}
.kpi .sb{color:var(--text3)}
.kpi.bl .num{color:var(--blue)}
.funnel{background:linear-gradient(180deg,#0b111b,#080d15);border:1px solid var(--border);border-radius:var(--radius)}
.funnel .st .ring{background:#070c14;border:2px solid var(--border);color:var(--text3);box-shadow:inset 0 2px 10px rgba(0,0,0,.6)}
.funnel .st.on .ring{border-color:var(--teal);color:var(--teal);box-shadow:0 0 20px rgba(45,212,191,.25),inset 0 0 12px rgba(45,212,191,.12)}
.funnel .st:hover .ring{border-color:var(--violet);color:var(--violet)}
.funnel .st .l{color:var(--text3);font-family:var(--mono)}
.funnel .ar{color:#26344b}
.tpill{background:#0d1420;color:var(--text2);border:1px solid var(--border)}
.card{background:linear-gradient(180deg,var(--panel-hi),var(--panel));border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 10px 26px rgba(0,0,0,.4)}
.card:hover{border-color:rgba(45,212,191,.55);box-shadow:0 20px 46px rgba(0,0,0,.6),0 0 30px rgba(45,212,191,.16)}
.card .thumb{background:radial-gradient(120% 90% at 50% 0%,#101a28,#060a11)}
.card .ck{border-color:#2b3a52}
.card .nm{color:var(--text)}
.card .mt,.dna-niche{color:var(--text3)}
.rrow{background:linear-gradient(180deg,var(--panel-hi),var(--panel));border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.rrow:hover{border-color:var(--border-hover)}
.rrow .rt{background:#070c14;border:1px solid var(--border)}
.rrow .mt{color:var(--text3)}
.concept{background:rgba(45,212,191,.07);border-left:2px solid var(--teal);color:#b6c6d8}
.logrow{background:#070c14;border:1px solid var(--border-soft)}
.logrow:hover{border-color:var(--border)}
.logrow .t{color:var(--text3)}
.logrow .tx{color:#cfd9e8}
.trend{background:linear-gradient(180deg,var(--panel-hi),var(--panel));border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.trend:hover{border-color:var(--border-hover)}
.trend .mt{color:var(--text3)}
.grade{background:#080d15}
.conn{background:linear-gradient(180deg,#0d1420,#0a0f18);border:1px solid var(--border);border-radius:var(--radius-sm)}
.conn.ok .dv{box-shadow:0 0 14px rgba(16,185,129,.7)}
.conn.bad .dv{box-shadow:0 0 14px rgba(239,68,68,.6)}
.modal{background:rgba(2,4,8,.82)}
.edwin,.pwin{background:#06090f;border:1px solid var(--border);box-shadow:var(--shadow),0 0 60px rgba(45,212,191,.07)}
.edbar,.pbar{background:linear-gradient(180deg,#0d1420,#080d15);border-bottom:1px solid var(--border)}
.edbar .title,.pbar .title{font-family:var(--mono);letter-spacing:.4px}
.cgroup{display:flex;align-items:center;gap:6px;font-size:.7rem;color:var(--text3);font-family:var(--mono);text-transform:uppercase;letter-spacing:.8px}
#toasts{max-width:420px}
.toast{background:rgba(8,12,20,.96);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:0 20px 50px rgba(0,0,0,.65)}
.toast .tm{color:var(--text2)}
.dna-strip{box-shadow:0 0 14px rgba(0,0,0,.5)}
@media(max-width:900px){#rail{width:62px}.rail-link{width:46px;height:42px}}
</style>
</head>
<body>

  <div id="topbar">

</div>
<div class="modal" id="editor-modal"><div class="edwin">

    <span class="title" id="ed-title">Visual Editor</span>

      <option value="'Space Grotesk','Inter',system-ui,sans-serif">Space Grotesk</option>

  </div>

<div id="toasts"></div>
<script>
const API='/api';
let state={view:'home',professions:[],products:[],trends:[],selected:new Set(),filters:{status:'all',type:'all',q:''},coverRebuildRunning:false};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function showToast(kind,tt,tm){const c=document.getElementById('toasts');const t=document.createElement('div');t.className='toast '+kind;t.innerHTML='<div style="flex:1"><div class="tt"></div><div class="tm"></div></div><button class="btn ghost" style="padding:2px 8px">✕</button>';t.querySelector('.tt').textContent=tt;t.querySelector('.tm').textContent=tm;t.querySelector('button').onclick=()=>t.remove();c.appendChild(t);if(c.children.length>4)c.firstChild.remove();setTimeout(()=>t.remove(),kind==='success'?3800:5200);}

// ── Design DNA Client-Side Detection ──
const _dnaKeywords={tech:/tech|software|ai|app|digital|cyber|code|saas|drone|smart home/i,recovery:/recovery|sober|aa |refuge|faith|therapy/i,spiritual:/faith|bible|dharma|prayer|church|gospel/i,beauty:/beauty|makeup|hair|lash|brow|salon|spa|skincare/i,fashion:/fashion|aesthetic|style|wear|clothing/i,fitness:/fitness|gym|train|sport|pilates|crossfit/i,craft:/craft|art|diy|maker|handmade|pottery|candle|soap|resin|cricut/i,food:/food|chef|bake|brew|cook|kitchen|restaurant|coffee/i,outdoor:/outdoor|fish|hunt|camp|hike|garden|bee/i,home:/home|clean|organize|interior|decor|plant/i,wellness:/wellness|yoga|massage|breath|meditation|nutrition/i,finance:/finance|notary|tax|bookkeep|account|loan|audit/i,trades:/trade|plumb|hvac|roof|electric|concrete|fence|pest|pool|drywall/i,pyro:/pyro|firework|pyrotechnic|fuse|lift|burst|rocket/i};
const _dnaStyleMap={tech:'brutalist',recovery:'editorial',spiritual:'luxe',beauty:'luxe',fashion:'luxe',fitness:'organic',craft:'playful',food:'organic',outdoor:'organic',home:'organic',wellness:'editorial',finance:'minimal',trades:'technical',pyro:'heritage'};
const _dnaTypeOverrides={invoice:'brutalist',journal:'editorial',spreadsheet:'brutalist',booking:'minimal','wall-art':'luxe',worksheet:'playful','party-printable':'playful',brand:'luxe',website:'brutalist',tool:'technical',bundle:'luxe'};
function detectDNA(profName,type){if(!profName)return{style:'editorial',niche:'default'};let niche='default';for(const[k,rx]of Object.entries(_dnaKeywords)){if(rx.test(profName)){niche=k;break;}}const style=_dnaTypeOverrides[type]||_dnaStyleMap[niche]||'editorial';return{style,niche};}

const VIEWS=['home','catalog','review','social','ads','calendar','analytics','automation','marketplace','trends'];
function go(v){state.view=v;VIEWS.forEach(x=>{const el=document.getElementById('rv-'+x);if(el)el.className='rail-link'+(x===v?' active':'');});document.getElementById('crumb').textContent={home:'Overview',catalog:'Catalog',review:'Review Queue',social:'Social Scheduler',ads:'Ad Spend',calendar:'Content Calendar',analytics:'Sales Analytics',automation:'Automation',marketplace:'Marketplace',trends:'Trends'}[v]||v;render();}
const statusClass=s=>'st-'+(String(s||'draft').replace('_','-'));
async function loadAll(){const run=async(u,cb)=>{try{cb(await (await fetch(u)).json());}catch(e){console.error(u,e);}};
  await run(`${API}/professions`,d=>state.professions=Array.isArray(d)?d:[]);
  await run(`${API}/products`,d=>state.products=Array.isArray(d)?d:[]);
  await run(`${API}/trends`,d=>state.trends=(d&&d.all)||[]);
  await updateAutoStatus();}
function counts(){const p=state.products;return{total:p.length,draft:p.filter(x=>x.status==='draft').length,review:p.filter(x=>x.status==='pending-review'||x.status==='pending_review').length,approved:p.filter(x=>x.status==='approved').length,listed:p.filter(x=>x.status==='listed'||x.status==='published').length};}
async function updateAutoStatus(){try{const s=await (await fetch(`${API}/automation/status`)).json();const live=!!s.running;const el=document.getElementById('auto-status');el.className='auto-status'+(live?' live':'');const w=document.getElementById('auto-word');w.textContent=live?'Engine Live':'Engine Idle';}catch(e){document.getElementById('auto-word').textContent='Offline';}}
function render(){const c=document.getElementById('content');
  if(state.view==='home')c.innerHTML=renderHome();
  else if(state.view==='catalog')c.innerHTML=renderCatalog();
  else if(state.view==='review')c.innerHTML=renderReview();
  else if(state.view==='automation')renderAutomation(c);
  else if(state.view==='social'){c.innerHTML=renderSocial();if(!state.socialPosts)loadSocialPosts();}
  else if(state.view==='ads'){c.innerHTML=renderAds();if(!state.adsData)loadAdsData();}
  else if(state.view==='calendar'){c.innerHTML=renderCalendar();if(!state.calendarData)loadCalendar();}
  else if(state.view==='analytics'){c.innerHTML=renderAnalytics();if(!state.analyticsData&&typeof loadAnalytics==='function')loadAnalytics();}
  else if(state.view==='marketplace')renderMarketplace(c);
  else if(state.view==='trends')renderTrends(c);}
let coverRebuildRunning=false;
async function refresh(){await loadAll();render();}
function thumbFor(p){const t=p&&p.type;return t==='invoice'?'🧾':t==='checklist'?'✅':t==='spreadsheet'?'📊':t==='social'?'📱':t==='brand'?'🎨':t==='journal'?'📓':t==='bundle'?'📦':t==='booking'?'📅':t==='wall-art'?'🖼️':t==='worksheet'?'✏️':t==='planner'?'🗓️':t==='party-printable'?'🎉':t==='pyro-batch'?'⚗️':t==='pyro-lift-fuse'?'🎆':t==='pyro-shoot-log'?'🧨':'🗂️';}
function prodImg(p){return p&&p.preview_path?`<img src="/api/products/${p.id}/preview-image" loading="lazy" alt="">`:null;}
function renderHome(){
  const c=counts();
  const rq=state.professions.filter(x=>x.status==='researching'||x.status==='generating'||x.status==='reviewing').length;
  const funnel=[['Discover','research'],['Generate','draft'],['Review','review'],['Approve','approved'],['Publish','listed']]
    .map(([l,key])=>{
      const n=key==='research'?rq:key==='draft'?c.draft:key==='review'?c.review:key==='approved'?c.approved:c.listed;
      return `<button class="st ${n>0?'on':''}" title="Filter catalog: ${l}" onclick="funnelGo('${key}')"><div class="ring">${n}</div><div class="l">${l}</div></button>`;
    }).join('<div class="ar">→</div>');
  const k=`<div class="kpi"><div class="lb">Total Products</div><div class="num tc">${c.total}</div></div>`+`<div class="kpi"><div class="lb">Active (Listed)</div><div class="num gn">${c.listed}</div></div>`+`<div class="kpi"><div class="lb">In Review</div><div class="num am">${c.review}</div></div>`+`<div class="kpi"><div class="lb">Ready (Approved)</div><div class="num bl">${c.approved}</div></div>`+`<div class="kpi" id="etsy-cap-kpi"><div class="lb">Etsy Today</div><div class="num" style="color:var(--amber)">--</div></div>`+`<div class="kpi" id="revenue-kpi"><div class="lb">Est. Revenue</div><div class="num gn">$--</div></div>`;
  const acts=window._smartActionsHtml||''; acts+=`<button class="btn primary" onclick="runSweep()" style="justify-content:flex-start">🛰️ 🛰️ Discover New Niches</button>`
    +`<button class="btn primary" onclick="runAutoCycle()" style="justify-content:flex-start">▶ ▶ Generate Products Now</button>`
    +`<button class="btn green" onclick="deployBundles()" style="justify-content:flex-start">📦 📦 Publish Bundles → Gumroad</button>`
    +`<button class="btn green" onclick="deployLeadMagnet()" style="justify-content:flex-start">🧲 🧲 Publish Lead Magnet</button>`
    +`<button class="btn" onclick="syncSales()" style="justify-content:flex-start">💰 Sync Sales</button>`
    +`<button class="btn" onclick="go('review');rebuildAll()" style="justify-content:flex-start">✨ ✨ Rebuild All Covers</button>`;
  return `<div class="sh"><div><h2>🚀 Command Center</h2><div class="desc">Discover niches → generate innovative products → review → publish to Etsy & Gumroad.</div></div></div>
  <div class="kpis" style="margin-bottom:14px">${k}</div>
  <div class="panel" style="margin-bottom:16px"><div class="panel-title">Pipeline</div><div style="padding:14px 18px"><div class="funnel" style="border:none;box-shadow:none">${funnel}</div></div></div>
  <div style="width:calc(50% - 8px);display:inline-block;vertical-align:top"><div class="panel"><div class="panel-title">Quick Actions</div><div style="display:flex;flex-direction:column;gap:8px;padding:14px 16px;align-items:stretch">${acts}</div></div></div>
  <div style="width:calc(50% - 8px);display:inline-block;vertical-align:top"><div class="panel"><div class="panel-title">Recent Activity</div><div class="logs" id="home-log" style="max-height:320px"><div style="color:#7c8aa0;padding:12px">Loading…</div></div></div></div>`;
}
async function loadHomeLog(){try{const logs=await (await fetch(`${API}/automation/log`)).json();const el=document.getElementById('home-log');if(!el)return;const rows=(Array.isArray(logs)?logs:[]).slice(0,14).map(l=>`<div class="logrow ${l.status}"><div class="t">${new Date(l.created_at).toLocaleTimeString().slice(0,5)}</div><div class="act">${l.action}</div><div class="tx">${esc(l.details)}</div></div>`).join('');el.innerHTML=rows||'<div style="color:#7c8aa0;padding:12px">No activity yet.</div>';}catch(e){}}
function renderCatalog(){
  const types=[...new Set(state.products.map(p=>p.type))];
  const f=state.filters;
  let list=state.products;
  if(f.status!=='all')list=list.filter(p=>p.status===f.status);
  if(f.type!=='all')list=list.filter(p=>p.type===f.type);
  if(f.q)list=list.filter(p=>p.name&&p.name.toLowerCase().includes(f.q.toLowerCase()));
  const card=p=>{const sel=state.selected.has(p.id);const img=prodImg(p);const shortC=conceptShort(p);const _dna=detectDNA(p.prof_name||'',p.type);
    return `<div class="card ${sel?'sel':''}" onclick="toggleSel(${p.id})" ondblclick="previewProduct(${p.id})">
      <div style="position:relative"><span class="ck"></span><div class="thumb">${img||`<span class="ph">${thumbFor(p)}</span>`}<div class="dna-strip ${_dna.style}"></div></div></div>
      <div class="bd"><div class="nm" title="${esc(p.name)}">${esc(p.name)}</div><div class="mt">${esc(p.prof_name||'')} · ${esc(p.type)}<div style="display:flex;gap:4px;align-items:center;margin-top:3px"><span class="dna-badge ${_dna.style}">${_dna.style}</span><span class="dna-niche">${_dna.niche}</span></div></div>${shortC}
      <div style="display:flex;justify-content:space-between"><span>${pillFor(p)}</span><span class="pr">${esc(p.price||'')}</span></div></div></div>`;};
  const sel=state.selected.size;
  return `<div class="sh"><div><h2>📦 Product Catalog</h2><div class="desc">Innovative digital products — playbooks, pricing guides, calculators, email kits, SOPs, and more.</div></div><button class="btn ghost" onclick="go('home')">← Overview</button></div>
  <div class="frow">
    <div class="search"><span>🔍</span><input placeholder="Search products…" value="${esc(f.q)}" oninput="setQ(this.value)"></div>
    <select onchange="setStatus(this.value)"><option value="all">All status</option><option value="draft">Draft</option><option value="pending-review">Review</option><option value="approved">Approved</option><option value="listed">Listed</option><option value="rejected">Rejected</option></select>
    <select onchange="setType(this.value)"><option value="all">All types</option>${types.map(t=>`<option value="${esc(t)}" ${t===f.type?'selected':''}>${esc(t)}</option>`).join('')}</select>
    <button class="btn" onclick="toggleSel(null)" ${sel?'':'disabled'}>Clear (${sel})</button>
    <button class="btn green" onclick="batchSet('approved')" ${sel?'':'disabled'}>Approve</button>
    <button class="btn" onclick="batchSet('listed')" ${sel?'':'disabled'}>List</button>
    <button class="btn red" onclick="batchReject()" ${sel?'':'disabled'}>Reject</button>
    <span style="color:#7c8aa0;font-size:0.78rem">${list.length} shown · ${types.length} types</span>
  </div>
  ${list.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px">${list.map(card).join('')}</div>`:`<div class="panel" style="padding:30px;text-align:center;color:#7c8aa0">
<div style="margin-bottom:14px;padding:12px 16px;background:var(--panel);border:1px solid var(--border);border-radius:10px">
  <div style="font-size:0.68rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--teal);margin-bottom:8px">Product Types</div>
  <div style="display:flex;flex-wrap:wrap;gap:6px">
    <span style="padding:3px 8px;border-radius:6px;font-size:0.68rem;background:rgba(45,212,191,0.1);color:var(--teal)">📘 Playbook $24</span>
    <span style="padding:3px 8px;border-radius:6px;font-size:0.68rem;background:rgba(45,212,191,0.1);color:var(--teal)">💰 Pricing Bible $19</span>
    <span style="padding:3px 8px;border-radius:6px;font-size:0.68rem;background:rgba(45,212,191,0.1);color:var(--teal)">🧮 Calculator $15</span>
    <span style="padding:3px 8px;border-radius:6px;font-size:0.68rem;background:rgba(45,212,191,0.1);color:var(--teal)">✉️ Email Scripts $15</span>
    <span style="padding:3px 8px;border-radius:6px;font-size:0.68rem;background:rgba(45,212,191,0.1);color:var(--teal)">📋 SOP Package $19</span>
    <span style="padding:3px 8px;border-radius:6px;font-size:0.68rem;background:rgba(100,116,139,0.1);color:#94a3b8">+ 28 more types</span>
  </div>
</div>
No products match. Try adjusting your filters or run a discovery sweep.</div>`}`;
}
function toggleSel(id){if(id===null){state.selected.clear();}else{if(state.selected.has(id))state.selected.delete(id);else state.selected.add(id);}render();}
function setQ(v){state.filters.q=v;render();}
function setStatus(v){state.filters.status=v;render();}
function setType(v){state.filters.type=v;render();}
/* Rebuild all covers via cursor-based batches (safe: advances, preserves old previews). */
async function regenerateAll(){
  if(coverRebuildRunning)return;
  if(!confirm('Rebuild covers in background batches? Keep this tab open. Existing previews are kept if a rebuild fails.'))return;
  coverRebuildRunning=true;
  let done=0,failed=0,afterId=0,maxId;
  try{
    while(true){
      const q=new URLSearchParams({limit:'5',force:'1',afterId:String(afterId)});
      if(maxId!==undefined)q.set('maxId',String(maxId));
      const res=await fetch(`${API}/previews/generate?${q}`,{method:'POST'});
      const d=await res.json();
      if(!res.ok)throw new Error(d.error||'Preview request failed');
      done+=d.generated;failed+=d.failed;
      showToast('info','Rebuilding…',`${done} rebuilt · ${failed} failed · ${d.remaining} remaining`);
      if(!d.hasMore)break;
      if(!Number.isSafeInteger(d.nextAfterId)||d.nextAfterId<=afterId)throw new Error('Batch did not advance; stopped to avoid duplicates');
      afterId=d.nextAfterId;maxId=d.maxId;
    }
    showToast(failed?'error':'success',failed?'Rebuild Finished with Failures':'Rebuild Complete',`${done} covers rebuilt; ${failed} failed.`);
  }catch(e){
    showToast('error','Rebuild Stopped',`${done} rebuilt; ${failed} failed. ${e.message}`);
  }finally{
    coverRebuildRunning=false;
  }
}
async function approveProduct(id){await fetch(`${API}/products/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'approved'})});showToast('success','Approved','Product approved');await refresh();}

function renderCalendar(){
  state.calendarMonth = state.calendarMonth || new Date().toISOString().slice(0,7);
  var cal = state.calendarData || {days:{}, posts:0, products:0, ads:0};
  var month = state.calendarMonth;
  var year = parseInt(month.slice(0,4));
  var mon = parseInt(month.slice(5,7));
  var daysInMonth = new Date(year, mon, 0).getDate();
  var firstDay = new Date(year, mon-1, 1).getDay();
  
  var dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var header = dayNames.map(function(d){ return '<div style="text-align:center;font-size:0.68rem;font-weight:700;color:var(--muted);padding:8px 0">'+d+'</div>'; }).join('');
  
  var cells = '';
  // Empty cells before first day
  for(var i=0; i<firstDay; i++) cells += '<div style="min-height:80px"></div>';
  
  for(var d=1; d<=daysInMonth; d++){
    var dayStr = month + '-' + String(d).padStart(2,'0');
    var dayData = cal.days[dayStr] || {posts:0,products:0,ads:0};
    var hasActivity = dayData.posts > 0 || dayData.products > 0 || dayData.ads > 0;
    var today = new Date().toISOString().slice(0,10) === dayStr;
    
    cells += '<div style="min-height:80px;padding:6px;border:1px solid '+(today?'var(--teal)':'var(--border)')+';border-radius:var(--radius-xs);background:'+(today?'var(--teal-dim)':hasActivity?'var(--surface)':'transparent')+'">'
      + '<div style="font-size:0.72rem;font-weight:700;color:'+(today?'var(--teal)':'var(--text)')+'">'+d+'</div>';
    if(dayData.posts > 0) cells += '<div style="font-size:0.62rem;color:var(--amber);margin-top:2px">📱 '+dayData.posts+' post'+(dayData.posts>1?'s':'')+'</div>';
    if(dayData.products > 0) cells += '<div style="font-size:0.62rem;color:var(--teal);margin-top:2px">📦 '+dayData.products+' product'+(dayData.products>1?'s':'')+'</div>';
    if(dayData.ads > 0) cells += '<div style="font-size:0.62rem;color:var(--green);margin-top:2px">💰 '+dayData.ads+' ad'+(dayData.ads>1?'s':'')+'</div>';
    cells += '</div>';
  }
  
  return '<div class="sh"><div><h2>📅 Content Calendar</h2><div class="desc">Monthly view of all scheduled activity — posts, products, and ad spend.</div></div><button class="btn ghost" onclick="go(\'home\')">← Overview</button></div>'
    + '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">'
    + '<button class="btn" onclick="changeCalendarMonth(-1)">← Prev</button>'
    + '<div style="font-weight:700;font-size:1rem;color:var(--text)">'+year+'-'+String(mon).padStart(2,'0')+'</div>'
    + '<button class="btn" onclick="changeCalendarMonth(1)">Next →</button>'
    + '<div style="flex:1"></div>'
    + '<div style="display:flex;gap:12px;font-size:0.72rem">'
    + '<span style="color:var(--amber)">📱 '+cal.posts+' posts</span>'
    + '<span style="color:var(--teal)">📦 '+cal.products+' products</span>'
    + '<span style="color:var(--green)">💰 '+cal.ads+' ads</span>'
    + '</div></div>'
    + '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">'+header+cells+'</div>';
}

function changeCalendarMonth(dir){
  var parts = state.calendarMonth.split('-');
  var m = parseInt(parts[1]) + dir;
  var y = parseInt(parts[0]);
  if(m < 1) { m = 12; y--; }
  if(m > 12) { m = 1; y++; }
  state.calendarMonth = y + '-' + String(m).padStart(2,'0');
  loadCalendar();
}

async function loadCalendar(){
  try {
    var res = await fetch(API+'/calendar?month='+(state.calendarMonth||new Date().toISOString().slice(0,7)));
    state.calendarData = await res.json();
    if(state.view === 'calendar') render();
  } catch(e) {}
}

async function loadSmartActions(){
  try {
    var res = await fetch(API+'/smart-actions');
    var data = await res.json();
    if(data.actions && data.actions.length) {
      window._smartActionsHtml = '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">'
        + data.actions.map(function(a){
          return '<button class="btn" onclick="executeSmartAction(\''+a.action+'\')" style="border-left:3px solid '+a.color+';font-size:0.76rem">'+a.icon+' '+a.title+'</button>';
        }).join('')
        + '</div>';
    } else {
      window._smartActionsHtml = '';
    }
  } catch(e) { window._smartActionsHtml = ''; }
}

function executeSmartAction(action){
  switch(action){
    case 'approve-all': approveAll(); break;
    case 'generate-drafts': runAutoCycle(); break;
    case 'auto-list': autoList(); break;
    case 'run-sweep': runSweep(); break;
    case 'batch-social': go('social'); break;
    case 'rebuild-all': rebuildAll(); break;
    case 'passion-generate': go('home'); runAutoCycle(); break;
    default: showToast('Action: '+action, 'info');
  }
}

function copyNewsletter(){

/* ── Visual editor (product HTML recolor + export) ── */
let ed={id:null,html:'',colors:{primary:'#0f172a',accent:'#2dd4bf',font:"'Space Grotesk','Inter',system-ui,sans-serif"},type:'invoice',name:''};
function editProduct(id){const p=state.products.find(x=>x.id===id);if(!p)return;const m=p.html_content&&p.html_content.length>40?p.html_content:fallbackHtml(p);ed={id:p.id,html:m,colors:{primary:'#0f172a',accent:'#2dd4bf',font:"'Space Grotesk','Inter',system-ui,sans-serif"},type:p.type,name:p.name||p.type};_edOpen();}
function _edOpen(){document.getElementById('ed-title').textContent='Editing: '+(ed.name||ed.type);document.getElementById('ed-preview').innerHTML=ed.html;document.getElementById('ed-primary').value='#0f172a';document.getElementById('ed-accent').value='#2dd4bf';document.getElementById('editor-modal').className='modal open';}
function _clr(key,v){const pre=document.getElementById('ed-preview');const old=ed.colors[key];if(old&&old.toLowerCase()!==v.toLowerCase())pre.innerHTML=pre.innerHTML.replace(new RegExp(old.replace('#','#'),'gi'),v);ed.colors[key]=v;}
function _font(v){document.getElementById('ed-preview').innerHTML=document.getElementById('ed-preview').innerHTML.replace(/font-family:[^;]+;/gi,'font-family:'+v+';');ed.colors.font=v;}
async function saveEditor(){if(!ed.id)return;const html=document.getElementById('ed-preview').innerHTML;await fetch(`${API}/products/${ed.id}/html`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({html_content:html})});showToast('success','Saved','Template updated');}
async function exportEditor(){if(!ed.id)return;const html=document.getElementById('ed-preview').innerHTML;const name=(ed.name||ed.type).toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+ed.type;showToast('info','Exporting…','Generating PDF');try{const r=await fetch(`${API}/export/render`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({html,type:ed.type,filename:name})});if(!r.ok){const e=await r.json();throw new Error(e.error||'Export failed');}const b=await r.blob();const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name+'.pdf';a.click();showToast('success','Exported','PDF ready');}catch(e){showToast('error','Export Failed',e.message);}}
function fallbackHtml(p){return `<div style="font-family:'Space Grotesk','Inter',system-ui,sans-serif;padding:60px;background:#f8f7f4;color:#14110f"><h1 style="font-size:40px">${esc(p.name||'Product')}</h1><p style="font-size:18px;color:#57534e">${esc(p.prof_name||'')} · ${esc(p.type)} · ${esc(p.price||'')}</p><div style="margin-top:24px;color:#78716c">Premium digital template — edit to customize.</div></div>`;}
document.getElementById('ed-primary').onchange=e=>_clr('primary',e.target.value);
document.getElementById('ed-accent').onchange=e=>_clr('accent',e.target.value);
document.getElementById('ed-font').onchange=e=>_font(e.target.value);

function renderSocial(){
  var posts = state.socialPosts || [];
  var products = state.products || [];
  var listed = products.filter(function(p){ return p.status === 'listed'; });
  
  var calendar = posts.map(function(p){
    var d = new Date(p.scheduledAt);
    var dateStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    var statusColor = p.status === 'posted' ? 'var(--green)' : p.status === 'cancelled' ? 'var(--red)' : 'var(--amber)';
    return '<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px">'
      + '<div style="width:10px;height:10px;border-radius:50%;background:' + statusColor + ';flex-shrink:0"></div>'
      + '<div style="flex:1;min-width:0">'
      + '<div style="font-weight:600;font-size:0.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + (p.content || '').slice(0, 60) + '...</div>'
      + '<div style="font-size:0.72rem;color:var(--muted)">' + p.platform + ' · ' + dateStr + ' · ' + p.status + '</div>'
      + '</div>'
      + (p.status === 'scheduled' ? '<button class="btn red" onclick="cancelSocialPost(' + p.id + ')" style="font-size:0.72rem;padding:4px 10px">Cancel</button>' : '')
      + '</div>';
  }).join('');

  return '<div class="sh"><div><h2>📱 Social Scheduler</h2><div class="desc">Generate and schedule posts for Pinterest, Instagram, Twitter, and Facebook.</div></div><button class="btn ghost" onclick="go(\'home\')">← Overview</button></div>'
    + '<div style="display:grid;grid-template-columns:1fr 320px;gap:16px">'
    + '<div>'
    + '<div class="panel" style="margin-bottom:14px"><div class="panel-title">Scheduled Posts</div><div style="padding:12px;max-height:500px;overflow:auto">'
    + (posts.length ? calendar : '<div style="text-align:center;color:var(--muted);padding:20px">No scheduled posts yet. Generate one below!</div>')
    + '</div></div>'
    + '</div>'
    + '<div>'
    + '<div class="panel" style="margin-bottom:14px"><div class="panel-title">Generate Post</div><div style="padding:14px">'
    + '<select id="social-product" style="width:100%;margin-bottom:8px"><option value="">Select a product...</option>'
    + listed.map(function(p){ return '<option value="' + p.id + '">' + (p.name || '').slice(0,40) + ' (' + p.type + ')</option>'; }).join('')
    + '</select>'
    + '<select id="social-platform" style="width:100%;margin-bottom:8px">'
    + '<option value="pinterest">📌 Pinterest</option><option value="instagram">📸 Instagram</option><option value="twitter">🐦 Twitter</option><option value="facebook">📘 Facebook</option><option value="tiktok">🎵 TikTok</option><option value="linkedin">💼 LinkedIn</option>'
    + '</select>'
    + '<button class="btn primary" onclick="generateSocialPost()" style="width:100%">✨ Generate & Schedule</button><div style="margin-top:8px;text-align:center"><button class="btn" onclick="batchSocialGenerate()" style="width:100%;font-size:0.76rem">📱 Batch Generate (All Listed)</button></div>'
    + '<div id="social-preview" style="margin-top:12px;display:none"></div>'
    + '</div></div>'
    + '<div class="panel"><div class="panel-title">Quick Stats</div><div style="padding:14px">'
    + '<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="color:var(--muted);font-size:0.82rem">Scheduled</span><span style="font-weight:700">' + posts.filter(function(p){return p.status==='scheduled'}).length + '</span></div>'
    + '<div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="color:var(--muted);font-size:0.82rem">Posted</span><span style="font-weight:700;color:var(--green)">' + posts.filter(function(p){return p.status==='posted'}).length + '</span></div>'
    + '<div style="display:flex;justify-content:space-between"><span style="color:var(--muted);font-size:0.82rem">Products Ready</span><span style="font-weight:700;color:var(--teal)">' + listed.length + '</span></div>'
    + '</div></div>'
    + '</div></div>';
}

async function generateSocialPost(){
  var prodEl = document.getElementById('social-product');
  var platEl = document.getElementById('social-platform');
  var productId = prodEl.value;
  var platform = platEl.value;
  if(!productId) return showToast('Select a product first', 'warning');
  
  showToast('Generating ' + platform + ' post...', 'info');
  try {
    var res = await fetch(API+'/social/generate', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({productId:parseInt(productId), platform:platform})});
    var data = await res.json();
    if(data.ok) {
      var preview = document.getElementById('social-preview');
      preview.style.display = 'block';
      preview.innerHTML = '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;font-size:0.82rem;line-height:1.5;white-space:pre-wrap;max-height:200px;overflow:auto">' + (data.content || '').replace(/</g,'&lt;') + '</div>'
        + '<div style="display:flex;gap:6px;margin-top:8px">'
        + '<button class="btn primary" onclick="schedulePost(' + productId + ',\'' + platform + '\',\'\')" style="flex:1">Schedule</button>'
        + '<button class="btn green" onclick="postNow(' + productId + ',\'' + platform + '\')" style="flex:1">⚡ Post Now</button>'
        + '</div>';
      window._lastSocialContent = data.content;
    }
  } catch(e) {
    showToast('Error: ' + e.message, 'warning');
  }
}

async function schedulePost(productId, platform, contentB64){
  try {
    var content = window._lastSocialContent || (contentB64 ? decodeURIComponent(escape(atob(contentB64))) : '');
    var scheduledAt = new Date(Date.now() + 3600000).toISOString(); // 1 hour from now
    var res = await fetch(API+'/social/schedule', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({productId:parseInt(productId), platform:platform, content:content, scheduledAt:scheduledAt})});
    var data = await res.json();
    if(data.ok) {
      showToast('Post scheduled for 1 hour from now', 'success');
      loadSocialPosts();
    }
  } catch(e) {
    showToast('Error: ' + e.message, 'warning');
  }
}

async function postNow(productId, platform){
  try {
    var res = await fetch(API+'/social/post-now', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({productId:parseInt(productId), platform:platform})});
    var data = await res.json();
    if(data.ok) {
      showToast('Posted to ' + platform + '!', 'success');
      loadSocialPosts();
    }
  } catch(e) {
    showToast('Error: ' + e.message, 'warning');
  }
}

async function cancelSocialPost(id){
  try {
    await fetch(API+'/social/cancel', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:id})});
    showToast('Post cancelled', 'success');
    loadSocialPosts();
  } catch(e) {}
}

async function loadSocialPosts(){
  try {
    var res = await fetch(API+'/social/calendar');
    var data = await res.json();
    state.socialPosts = data.posts || [];
    if(state.view === 'social') render();
  } catch(e) {}
}

function renderAds(){
  var ads = state.adsData || {budget:0, spent:0, remaining:0, percentUsed:0, activeRuns:0, recentRuns:[]};
  var pct = Math.min(100, ads.percentUsed || 0);
  var barColor = pct > 90 ? 'var(--red)' : pct > 70 ? 'var(--amber)' : 'var(--teal)';

  var runs = (ads.recentRuns || []).map(function(r){
    var statusColor = r.status === 'active' ? 'var(--green)' : r.status === 'cancelled' ? 'var(--red)' : 'var(--muted)';
    return '<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);border-radius:var(--radius-xs);margin-bottom:6px">'
      + '<div style="width:8px;height:8px;border-radius:50%;background:' + statusColor + '"></div>'
      + '<div style="flex:1"><div style="font-weight:600;font-size:0.82rem">' + (r.name || 'Campaign') + '</div><div style="font-size:0.72rem;color:var(--muted)">' + r.platform + ' · $' + r.amount + ' · ' + r.status + '</div></div>'
      + (r.status === 'active' ? '<button class="btn red" onclick="cancelAd(' + r.id + ')" style="font-size:0.72rem;padding:4px 10px">Cancel</button>' : '')
      + '</div>';
  }).join('');

  return '<div class="sh"><div><h2>💰 Ad Spend Dashboard</h2><div class="desc">Track your marketing budget across platforms.</div></div><button class="btn ghost" onclick="go(\'home\')">← Overview</button></div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">'
    + '<div class="kpi" style="border-left:3px solid var(--teal)"><div class="lb">Monthly Budget</div><div class="num" style="color:var(--teal)">$' + (ads.budget || 0).toLocaleString() + '</div></div>'
    + '<div class="kpi" style="border-left:3px solid ' + barColor + '"><div class="lb">Spent This Month</div><div class="num" style="color:' + barColor + '">$' + (ads.spent || 0).toLocaleString() + '</div></div>'
    + '<div class="kpi"><div class="lb">Remaining</div><div class="num" style="color:var(--green)">$' + (ads.remaining || 0).toLocaleString() + '</div></div>'
    + '<div class="kpi"><div class="lb">Active Campaigns</div><div class="num" style="color:var(--blue)">' + (ads.activeRuns || 0) + '</div></div>'
    + '</div>'
    + '<div style="height:12px;background:var(--surface);border-radius:6px;margin-bottom:20px;overflow:hidden"><div style="height:100%;width:' + pct + '%;background:' + barColor + ';border-radius:6px;transition:width 0.5s"></div></div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">'
    + '<div><div class="panel"><div class="panel-title">Commit Ad Spend</div><div style="padding:14px">'
    + '<input id="ad-name" placeholder="Campaign name" style="width:100%;margin-bottom:8px">'
    + '<select id="ad-platform" style="width:100%;margin-bottom:8px"><option value="google">Google Ads</option><option value="facebook">Facebook/Instagram</option><option value="pinterest">Pinterest</option><option value="tiktok">TikTok</option></select>'
    + '<input id="ad-amount" type="number" placeholder="Amount ($)" style="width:100%;margin-bottom:8px">'
    + '<button class="btn primary" onclick="commitAdSpend()" style="width:100%">💸 Commit Spend</button>'
    + '</div></div></div>'
    + '<div><div class="panel"><div class="panel-title">Set Monthly Budget</div><div style="padding:14px">'
    + '<input id="budget-input" type="number" value="' + (ads.budget || 0) + '" placeholder="Monthly budget ($)" style="width:100%;margin-bottom:8px">'
    + '<button class="btn" onclick="setAdBudget()" style="width:100%">💾 Save Budget</button>'
    + '<div style="margin-top:12px"><div class="panel-title" style="border:none;padding:0;margin-bottom:8px">Recent Campaigns</div>'
    + (runs || '<div style="color:var(--muted);font-size:0.82rem">No campaigns yet</div>')
    + '</div></div></div>'
    + '</div></div>';

async function commitAdSpend(){
  var name = document.getElementById('ad-name').value || 'Untitled';
  var platform = document.getElementById('ad-platform').value;
  var amount = parseFloat(document.getElementById('ad-amount').value) || 0;
  if(!amount) return showToast('Enter an amount', 'warning');
  
  try {
    var res = await fetch(API+'/ads/commit', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:name, platform:platform, amount:amount})});
    var data = await res.json();
    if(data.ok) {
      showToast('Committed $' + amount + ' to ' + platform, 'success');
      document.getElementById('ad-name').value = '';
      document.getElementById('ad-amount').value = '';
      loadAdsData(); loadCalendar(); loadAnalytics(); loadSmartActions();
    } else {
      showToast(data.error || 'Error', 'warning');
    }
  } catch(e) {
    showToast('Error: ' + e.message, 'warning');
  }
}

async function setAdBudget(){
  var budget = parseFloat(document.getElementById('budget-input').value) || 0;
  try {
    await fetch(API+'/ads/budget', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({budget:budget})});
    showToast('Budget set to $' + budget, 'success');
    loadAdsData();
  } catch(e) {}
}

async function cancelAd(id){
  try {
    await fetch(API+'/ads/cancel', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:id})});
    showToast('Campaign cancelled and refunded', 'success');
    loadAdsData();
  } catch(e) {}
}

async function loadAdsData(){
  try {
    var res = await fetch(API+'/ads/summary');
    state.adsData = await res.json();
    if(state.view === 'ads') render();
  } catch(e) {}
}
