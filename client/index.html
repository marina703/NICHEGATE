<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NicheGate — Flight Deck</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'14'%20fill%3D'%230a0f17'%2F%3E%3Ctext%20x%3D'32'%20y%3D'42'%20font-family%3D'Arial%2Csans-serif'%20font-size%3D'28'%20font-weight%3D'800'%20fill%3D'%232dd4bf'%20text-anchor%3D'middle'%3ENG%3C%2Ftext%3E%3C%2Fsvg%3E">
<meta name="robots" content="noindex,nofollow">
<script>
  // Pre-paint the saved theme before first render (no flash).
  try {
    var t = localStorage.getItem('ng_theme');
    if (t === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); }
  } catch (e) { /* private mode: light default */ }
  if (document.documentElement.getAttribute('data-theme') === 'dark') {
    document.write('<meta name="color-scheme" content="dark">');
  } else {
    document.write('<meta name="color-scheme" content="light">');
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Oswald:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/flightdeck.css">
</head>
<body>
  <nav id="rail" aria-label="Primary"></nav>

  <div id="main">
    <header id="topbar">
      <div class="crumb" id="crumb">Command Center</div>
      <div class="sp"></div>
      <div class="status-strip" id="status"></div>
      <button class="chip" id="theme-toggle" data-action="theme-toggle" title="Toggle light / dark theme"></button>
    </header>
    <main id="content" aria-live="polite"></main>
  </div>

  <div id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="/js/console.js"></script>
</body>
</html>
