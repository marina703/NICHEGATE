# NicheGate MCP Server Configuration
# Add this to: C:\Users\linde\.config\goose\config.yaml
# Or use: goose configure

extensions:
  # Filesystem access for enhanced file operations
  filesystem:
    command: npx
    args:
      - "-y"
      - "@anthropic/mcp-filesystem"
      - "--allowed-dir"
      - "C:\Users\linde\.skales-data\workspace\nichegate"

  # GitHub integration for repo management
  github:
    command: npx
    args:
      - "-y"
      - "@anthropic/mcp-github"
    env:
      GITHUB_TOKEN: "${GITHUB_TOKEN}"

  # SQLite database queries for analytics
  sqlite:
    command: npx
    args:
      - "-y"
      - "@anthropic/mcp-sqlite"
      - "--db-path"
      - "C:\Users\linde\.skales-data\workspace\nichegate\data\profession-box.db"

  # Puppeteer for browser automation and testing
  puppeteer:
    command: npx
    args:
      - "-y"
      - "@anthropic/mcp-puppeteer"

  # Web search for enhanced trend research
  web-search:
    command: npx
    args:
      - "-y"
      - "@anthropic/mcp-web-search"
    env:
      TAVILY_API_KEY: "${TAVILY_API_KEY}"  # Get free key at https://tavily.com


  # TikTok research via HasData
  tiktok:
    command: npx
    args:
      - '-y'
      - '@hasdata/tiktok-mcp'
    env:
      HASDATA_API_KEY: '${HASDATA_API_KEY}'

  # Instagram Graph API
  instagram:
    command: npx
    args:
      - '-y'
      - 'instagram-mcp-ai'
    env:
      IG_ACCESS_TOKEN: '${INSTAGRAM_ACCESS_TOKEN}'

  # YouTube search + transcripts
  youtube:
    command: npx
    args:
      - '-y'
      - '@granitebps/youtube-mcp'

  # Gumroad store operations
  gumroad:
    command: npx
    args:
      - '-y'
      - 'gumroad-mcp'
    env:
      GUMROAD_ACCESS_TOKEN: '${GUMROAD_ACCESS_TOKEN}'

  # Buffer social media scheduling
  buffer:
    command: npx
    args:
      - '-y'
      - '@damusix/buffer-mcp'
    env:
      BUFFER_ACCESS_TOKEN: '${BUFFER_API_TOKEN}'

  # Reddit research + posting
  reddit:
    command: npx
    args:
      - '-y'
      - '@preaverage/reddit-mcp'
      - 'serve'
  # Pinterest API v5 (263/266 operations)
  pinterest:
    command: npx
    args:
      - '-y'
      - '@nasdigitaluk/pinterest-mcp'
    env:
      PINTEREST_ACCESS_TOKEN: '${PINTEREST_ACCESS_TOKEN}'

  # Etsy Open API v3 (hosted)
  etsy:
    url: https://mcp.api.etsycloud.com/mcp

  # Cloudflare R2 for image hosting (replace catbox.moe)
  cloudflare:
    command: npx
    args:
      - "-y"
      - "@anthropic/mcp-cloudflare"
    env:
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN}"
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID}"
